# Build settings
markdown: kramdown
highlighter: rouge
encoding: utf-8
timezone: Europe/Warsaw

permalink: /:year/:month/:day/:title/

paginate: 10
paginate_path: /page:num/

include:
  - _pages

# NOTE: setting `exclude` replaces Jekyll's built-in default list rather than
# extending it, so the defaults are repeated here alongside our additions.
exclude:
  - .sass-cache
  - .jekyll-cache
  - gemfiles
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  - AGENTS.md
  - office
  - .github

plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jekyll-include-cache
  - jekyll-remote-theme
  - jekyll-seo-tag

category_archive:
  type: liquid
  path: /kategorie/
tag_archive:
  type: liquid
  path: /tagi/

compress_html:
  clippings: all
  ignore:
    envs: development

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      show_date: true
      read_time: true
      share: true
      related: true
      categories: spotkania
  - scope:
      path: "_pages"
      type: pages
    values:
      layout: single
      author_profile: true
